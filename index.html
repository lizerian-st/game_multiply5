<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學乘法小遊戲</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
    }

    .container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      min-width: 320px;
    }

    .timer-display {
      font-size: 24px;
      font-weight: bold;
      color: #e53e3e;
      margin-bottom: 15px;
      background: #fff5f5;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #feb2b2;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      transition: background-color 0.2s;
      margin: 10px 5px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .hidden {
      display: none !important;
    }

    .question-list {
      font-size: 20px;
      margin: 20px 0;
      line-height: 1.8;
    }

    .result-box {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px dashed #ccc;
      font-size: 18px;
      font-weight: bold;
      color: #2d3748;
    }
  </style>
</head>
<body>

  <div class="container">
    <button id="startBtn">開始遊戲</button>

    <div id="gameArea" class="hidden">
      <div class="timer-display">用時：<span id="timer">0.0</span> 秒</div>

      <div id="questions" class="question-list"></div>
      <button id="answerBtn">顯示答案</button>
      
      <div id="results" class="result-box hidden">
        <div id="mathDetails"></div>
        <div id="totalSum" style="margin-top: 10px; color: #2b6cb0;"></div>
      </div>

      <div>
        <button id="resetBtn" style="background-color: #6c757d;">重設遊戲</button>
      </div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const gameArea = document.getElementById('gameArea');
    const questionsDiv = document.getElementById('questions');
    const answerBtn = document.getElementById('answerBtn');
    const resultsDiv = document.getElementById('results');
    const mathDetailsDiv = document.getElementById('mathDetails');
    const totalSumDiv = document.getElementById('totalSum');
    const resetBtn = document.getElementById('resetBtn');
    const timerDisplay = document.getElementById('timer');

    let currentQuestions = [];
    let timerInterval = null;
    let elapsedTime = 0; // 單位：0.1秒 (例如 10 代表 1.0秒)

    // 產生 2 到 6 之間的隨機整數
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 啟動計時器 (每 100 毫秒 / 0.1 秒觸發一次)
    function startTimer() {
      clearInterval(timerInterval);
      elapsedTime = 0;
      timerDisplay.textContent = '0.0';

      timerInterval = setInterval(() => {
        elapsedTime++;
        // 轉化為保留一位小數的字串 (以避免 JavaScript 浮點數累積誤差)
        timerDisplay.textContent = (elapsedTime / 10).toFixed(1);
      }, 100);
    }

    // 停止計時器
    function stopTimer() {
      clearInterval(timerInterval);
    }

    // 開始遊戲
    startBtn.addEventListener('click', () => {
      currentQuestions = [];
      questionsDiv.innerHTML = '';
      
      for (let i = 0; i < 5; i++) {
        const a = getRandomInt(2, 6);
        const b = getRandomInt(2, 6);
        currentQuestions.push({ a, b, result: a * b });

        const qItem = document.createElement('div');
        qItem.textContent = `${a} x ${b}`;
        questionsDiv.appendChild(qItem);
      }

      startBtn.classList.add('hidden');
      gameArea.classList.remove('hidden');
      resultsDiv.classList.add('hidden');

      // 開始計時
      startTimer();
    });

    // 顯示答案
    answerBtn.addEventListener('click', () => {
      // 停止計時
      stopTimer();

      let sum = 0;
      let detailsHTML = '';

      currentQuestions.forEach((q) => {
        sum += q.result;
        detailsHTML += `<div>${q.a} x ${q.b} = ${q.result}</div>`;
      });

      mathDetailsDiv.innerHTML = detailsHTML;
      totalSumDiv.textContent = `總和：${sum}`;
      resultsDiv.classList.remove('hidden');
    });

    // 重設遊戲
    resetBtn.addEventListener('click', () => {
      stopTimer();
      gameArea.classList.add('hidden');
      resultsDiv.classList.add('hidden');
      startBtn.classList.remove('hidden');
    });
  </script>

</body>
</html>
